<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Train search (agent-tabs demo)</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #f4f5f8; color: #111827; }
    body.dark { background: #0b1220; color: #e5e7eb; }
    .stage { padding: 48px 56px 72px; max-width: 760px; }
    .card { background: #fff; border-radius: 16px; padding: 28px 28px 30px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    .dark .card { background: #111a2e; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0 0 22px; color: #6b7280; font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #6b7280; flex: 1; }
    input { height: 42px; border: 1px solid #d1d5db; border-radius: 10px; padding: 0 12px; font: 15px system-ui; color: inherit; background: transparent; }
    .dark input { border-color: #334155; }
    button { height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #111827; color: #fff; font: 600 15px system-ui; }
    .dark button { background: #f8fafc; color: #0b1220; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <h1>Find a train</h1>
      <p>Search departures between any two stations.</p>
      <div class="row">
        <label>From <input id="from" placeholder="Station"></label>
        <label>To <input id="to" placeholder="Station"></label>
        <label>Date <input id="date" placeholder="dd.mm.yyyy"></label>
        <button id="search">Search</button>
      </div>
    </div>
  </div>
  <script>if (location.hash === "#dark") document.body.classList.add("dark");</script>
</body>
</html>
