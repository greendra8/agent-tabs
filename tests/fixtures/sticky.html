<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sticky header (agent-tabs test)</title>
<style>
  body { margin: 0; font: 16px system-ui; }
  header { position: sticky; top: 0; height: 60px; background: #dc2626; color: #fff; display: flex; align-items: center; padding: 0 16px; }
  .row { height: 100px; border-bottom: 1px solid #ddd; padding: 0 16px; display: flex; align-items: center; }
</style></head>
<body>
  <!-- Like Vy's results: a sticky header over a long list. A full-page screenshot should show the
       header once, at the top, not over a row in the middle. -->
  <header>Departures</header>
  <script>for (let i = 1; i <= 40; i++) document.write(`<div class="row">Departure ${i}</div>`);</script>
</body>
</html>
